[project]
name = "whatferry"
version = "1.0.0"
description = "Move WhatsApp chats between Android and iPhone, in either direction, without erasing the iPhone"
readme = "README.md"
authors = [
    { name = "Edward Arghiroiu", email = "edward@ariamis.be" }
]
# pymobiledevice3 and wa-crypt-tools, both imported, are GPL-3.0-or-later.
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["whatsapp", "iphone", "android", "backup", "transfer", "chat", "migration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: System :: Archiving :: Backup",
]
requires-python = ">=3.14"
dependencies = [
    "iphone-backup-decrypt>=0.11.2",
    "pycryptodome>=4.2.0",
    "pymobiledevice3>=11.44.0",
    "wa-crypt-tools>=0.1.0",
]

[project.urls]
Source = "https://github.com/ariamis-be/whatferry"
Issues = "https://github.com/ariamis-be/whatferry/issues"
Changelog = "https://github.com/ariamis-be/whatferry/blob/master/CHANGELOG.md"
Security = "https://github.com/ariamis-be/whatferry/blob/master/SECURITY.md"

[project.scripts]
whatferry = "whatferry:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# The harness (harness/, beside src/) is imported from the repository root; it isn't in the wheel.
pythonpath = ["."]

[tool.uv]
# pyimg4 (through pymobiledevice3) pins pylzss 0.3.4, which has no Python 3.14
# wheels and so needs a C compiler to install. 0.3.9 has wheels everywhere;
# whatferry never touches the firmware-image code that uses it.
override-dependencies = ["pylzss>=0.3.9"]
