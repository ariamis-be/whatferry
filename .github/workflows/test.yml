name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Linux only: macOS and Windows runners cost too much to run on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: mise exec -- uv sync --locked
      - run: mise exec -- uv run pytest -v

  # The built page is committed; rebuilding it from web/ must change nothing.
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: mise exec -- pnpm install --frozen-lockfile
        working-directory: web
      - run: mise exec -- pnpm lint
        working-directory: web
      - run: mise exec -- pnpm build
        working-directory: web
      - name: Built page matches web/
        run: |
          status=$(git status --porcelain -- src/whatferry/ui/static)
          if [ -n "$status" ]; then
            echo "$status"
            echo "::error::src/whatferry/ui/static is stale: run 'pnpm build' in web/ and commit it"
            exit 1
          fi
